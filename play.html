#e{display:none;max-width:80vw;text-align:center;font-size:13px;opacity:.9}</style></head><body><div id="w"><h1>COMBAT HORIZENS</h1><div id="s">LOADING VERSION 1.02-beta</div><div id="b"><i id="bi"></i></div><div id="e"></div></div>
<script>
(function(){var BUILD=102,PARTS=["game-102-1.part", "game-102-2.part", "game-102-3.part", "game-102-4.part"],KEY='full'+BUILD;
function $(i){return document.getElementById(i);}
function bar(f,t){$('bi').style.width=Math.round(f*100)+'%';if(t)$('s').textContent=t;}
function base(){var h=location.href;if(/^https?:/.test(location.protocol)&&!/android_asset/.test(h))return h.replace(/[#?].*$/,'').replace(/[^\/]*$/,'');
  try{var s=JSON.parse(localStorage.getItem('dustline_v1')||'{}');var u=(s.updUrl||'').trim().replace(/\/+$/,'');if(u)return u+'/';}catch(e){}return '';}
function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('ch-update',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function get(k){return idb().then(function(db){return new Promise(function(res){try{var g=db.transaction('kv','readonly').objectStore('kv').get(k);g.onsuccess=function(){res(g.result);};g.onerror=function(){res(null);};}catch(e){res(null);}});}).catch(function(){return null;});}
function put(k,v){return idb().then(function(db){return new Promise(function(res){try{var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=function(){res();};tx.onerror=function(){res();};}catch(e){res();}});}).catch(function(){});}
function run(html){document.open();document.write(html);document.close();}
function fail(msg){var app=/CombatHorizensApp/.test(navigator.userAgent);$('e').style.display='block';$('e').textContent=msg+(app?' — starting the installed version instead…':' — check your connection and reload.');if(app)setTimeout(function(){location.replace('game.html');},2500);}
var inApp=/CombatHorizensApp/.test(navigator.userAgent);
get(KEY).then(function(v){if(v&&v.html&&v.html.length>1000000){bar(1,'STARTING');run(v.html);return;}
  var b=base();if(!b&&!/^https?:/.test(location.protocol)){fail('Update link not set');return;}
  var out=new Array(PARTS.length),done=0;
  Promise.all(PARTS.map(function(p,i){return fetch(b+p+'?v='+BUILD,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status+' on '+p);return r.text();}).then(function(t){out[i]=t;done++;bar(done/PARTS.length,'DOWNLOADING '+done+' / '+PARTS.length);});}))
  .then(function(){var html=out.join('');if(html.indexOf('COMBAT HORIZENS')<0||html.length<1000000)throw new Error('download looks broken');bar(1,'STARTING');
    return (inApp?put(KEY,{build:BUILD,html:html,at:Date.now()}):Promise.resolve()).then(function(){run(html);});})
  .catch(function(e){fail('Could not download the game ('+(e.message||e)+')');});});
})();
</script>
